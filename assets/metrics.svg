<svg viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Production impact metrics">
  <defs>
    <style><![CDATA[
      .card { opacity: 0; animation: rise 0.7s ease-out forwards; }
      .c1 { animation-delay: 0.1s; } .c2 { animation-delay: 0.3s; }
      .c3 { animation-delay: 0.5s; } .c4 { animation-delay: 0.7s; }
      .c5 { animation-delay: 0.9s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      text { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; }
    ]]></style>
  </defs>

  <!-- card 1: AUC lift -->
  <g class="card c1">
    <rect x="8" y="5" width="224" height="200" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>
    <circle cx="120" cy="80" r="42" stroke="#2a2e3f" stroke-width="9" fill="none"/>
    <circle cx="120" cy="80" r="42" stroke="#7aa2f7" stroke-width="9" fill="none" stroke-linecap="round" transform="rotate(-90 120 80)">
      <animate attributeName="stroke-dasharray" values="0 264; 198 264" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="120" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#7aa2f7">0.75</text>
    <text x="120" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0caf5">Default AUC</text>
    <text x="120" y="174" text-anchor="middle" font-size="12.5" fill="#787c99">0.65 → 0.75 with GNNs</text>
  </g>

  <!-- card 2: EWS -->
  <g class="card c2">
    <rect x="248" y="5" width="224" height="200" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>
    <circle cx="360" cy="80" r="42" stroke="#2a2e3f" stroke-width="9" fill="none"/>
    <circle cx="360" cy="80" r="42" stroke="#9ece6a" stroke-width="9" fill="none" stroke-linecap="round" transform="rotate(-90 360 80)">
      <animate attributeName="stroke-dasharray" values="0 264; 230 264" dur="1.6s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="360" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#9ece6a">0.87</text>
    <text x="360" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0caf5">Early-Warning System</text>
    <text x="360" y="174" text-anchor="middle" font-size="12.5" fill="#787c99">test AUC, drives collections</text>
  </g>

  <!-- card 3: infra cost -->
  <g class="card c3">
    <rect x="488" y="5" width="224" height="200" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>
    <circle cx="600" cy="80" r="42" stroke="#2a2e3f" stroke-width="9" fill="none"/>
    <circle cx="600" cy="80" r="42" stroke="#bb9af7" stroke-width="9" fill="none" stroke-linecap="round" transform="rotate(-90 600 80)">
      <animate attributeName="stroke-dasharray" values="0 264; 195 264" dur="1.6s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="600" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#bb9af7">−74%</text>
    <text x="600" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0caf5">Serving Infra Cost</text>
    <text x="600" y="174" text-anchor="middle" font-size="12.5" fill="#787c99">AWS Lambda optimization</text>
  </g>

  <!-- card 4: latency -->
  <g class="card c4">
    <rect x="728" y="5" width="224" height="200" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>
    <circle cx="840" cy="80" r="42" stroke="#2a2e3f" stroke-width="9" fill="none"/>
    <circle cx="840" cy="80" r="42" stroke="#e0af68" stroke-width="9" fill="none" stroke-linecap="round" transform="rotate(-90 840 80)">
      <animate attributeName="stroke-dasharray" values="0 264; 140 264" dur="1.6s" begin="1.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="840" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#e0af68">28s</text>
    <text x="840" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0caf5">Scoring Latency</text>
    <text x="840" y="174" text-anchor="middle" font-size="12.5" fill="#787c99">down from 60s</text>
  </g>

  <!-- card 5: scale -->
  <g class="card c5">
    <rect x="968" y="5" width="224" height="200" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>
    <circle cx="1080" cy="80" r="42" stroke="#2a2e3f" stroke-width="9" fill="none"/>
    <circle cx="1080" cy="80" r="42" stroke="#7dcfff" stroke-width="9" fill="none" stroke-linecap="round" transform="rotate(-90 1080 80)">
      <animate attributeName="stroke-dasharray" values="0 264; 264 264" dur="1.8s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1"/>
    </circle>
    <text x="1080" y="86" text-anchor="middle" font-size="17" font-weight="800" fill="#7dcfff">150M+</text>
    <text x="1080" y="152" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0caf5">Transactions</text>
    <text x="1080" y="174" text-anchor="middle" font-size="12.5" fill="#787c99">in the counterparty graph</text>
  </g>
</svg>
