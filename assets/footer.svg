<svg viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thanks for stopping by - let's build something intelligent">
  <defs>
    <linearGradient id="wave1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="ftGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="150" rx="16"/>
    </clipPath>
    <style><![CDATA[
      text { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; }
      .msg { opacity: 0; animation: fade 1.2s ease-out 0.4s forwards; }
      .sub { opacity: 0; animation: fade 1.2s ease-out 0.9s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .tw { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation-delay: 1s; } .tw3 { animation-delay: 1.8s; } .tw4 { animation-delay: 2.4s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 0.9; transform: scale(1.15); } }
      @media (prefers-reduced-motion: reduce) {
        .msg, .sub, .tw { animation: none !important; opacity: 1 !important; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="150" rx="16" fill="#16161e"/>
  <g clip-path="url(#frame)">
  <!-- drifting waves (paths are 2400 wide, sliding by one 1200px period) -->
  <g opacity="0.16">
    <path fill="url(#wave1)" d="M0 92 Q150 62 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 T2100 92 T2400 92 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -1200 0" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.3">
    <path fill="url(#wave1)" d="M0 108 Q150 84 300 108 T600 108 T900 108 T1200 108 T1500 108 T1800 108 T2100 108 T2400 108 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-1200 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.55">
    <path fill="url(#wave1)" d="M0 124 Q150 106 300 124 T600 124 T900 124 T1200 124 T1500 124 T1800 124 T2100 124 T2400 124 V150 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -1200 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="15" stroke="#2a2e3f" stroke-width="2" fill="none"/>

  <!-- twinkling stars -->
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13">
    <text class="tw"     x="150"  y="42" fill="#7dcfff">✦</text>
    <text class="tw tw2" x="332"  y="70" fill="#bb9af7">✦</text>
    <text class="tw tw3" x="852"  y="64" fill="#9ece6a">✦</text>
    <text class="tw tw4" x="1046" y="38" fill="#7aa2f7">✦</text>
  </g>

  <text class="msg" x="600" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="url(#ftGrad)">Thanks for stopping by - let's build something intelligent</text>
  <text class="sub" x="600" y="84" text-anchor="middle" font-size="12.5" fill="#787c99"></text>
</svg>
