<svg viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shreyansh Goyal - Machine Learning Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="0.5" stop-color="#1a1b27"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.35" stop-color="#bb9af7"/>
      <stop offset="0.7" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0; 1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#bb9af7" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#16161e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7aa2f7" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#c0caf5" stroke-opacity="0.035" stroke-width="1" fill="none"/>
    </pattern>
    <style><![CDATA[
      .fadeUp { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.45s; }
      .d3 { animation-delay: 0.75s; } .d4 { animation-delay: 0.95s; }
      .d5 { animation-delay: 1.15s; } .d6 { animation-delay: 1.35s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      .n2 { animation-delay: 0.6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .flow { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -14; } }
      .tw { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .tw2 { animation-delay: 0.9s; } .tw3 { animation-delay: 1.7s; } .tw4 { animation-delay: 2.3s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7); } 50% { opacity: 0.9; transform: scale(1.15); } }
      .pt { animation: rise 9s linear infinite; }
      .p2 { animation-delay: 1.5s; } .p3 { animation-delay: 3s; } .p4 { animation-delay: 4.5s; }
      .p5 { animation-delay: 6s; } .p6 { animation-delay: 7.5s; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        12% { opacity: 0.55; }
        85% { opacity: 0.25; }
        100% { transform: translateY(-330px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fadeUp, .node, .flow, .tw, .pt { animation: none !important; }
        .fadeUp, .node { opacity: 1 !important; }
        .pt { opacity: 0 !important; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#haloGrad)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" stroke="#2a2e3f" stroke-width="2" fill="none"/>

  <!-- rising particles -->
  <g>
    <circle class="pt"    cx="330"  cy="315" r="2"   fill="#7aa2f7"/>
    <circle class="pt p2" cx="470"  cy="315" r="1.5" fill="#bb9af7"/>
    <circle class="pt p3" cx="612"  cy="315" r="2.2" fill="#7dcfff"/>
    <circle class="pt p4" cx="742"  cy="315" r="1.5" fill="#9ece6a"/>
    <circle class="pt p5" cx="866"  cy="315" r="2"   fill="#bb9af7"/>
    <circle class="pt p6" cx="540"  cy="315" r="1.7" fill="#7aa2f7"/>
  </g>

  <!-- twinkling sparks -->
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15">
    <text class="tw"     x="322" y="52"  fill="#7dcfff">✦</text>
    <text class="tw tw2" x="856" y="40"  fill="#bb9af7">✦</text>
    <text class="tw tw3" x="905" y="252" fill="#7aa2f7">✦</text>
    <text class="tw tw4" x="292" y="262" fill="#9ece6a">✦</text>
  </g>

  <!-- left neural cluster -->
  <g stroke="#7aa2f7" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M60 60 L170 40"/><path d="M60 60 L180 130"/><path d="M40 150 L180 130"/>
    <path d="M80 240 L180 130"/><path d="M80 240 L160 220"/><path d="M170 40 L260 80"/>
    <path d="M180 130 L250 180"/><path d="M160 220 L250 180"/><path d="M260 80 L250 180"/>
  </g>
  <path class="flow" d="M180 130 L260 80" stroke="#7dcfff" stroke-opacity="0.55" stroke-width="1.5"/>
  <path class="flow" d="M60 60 L180 130" stroke="#7aa2f7" stroke-opacity="0.45" stroke-width="1.5"/>
  <g fill="#7aa2f7">
    <circle class="node" cx="60" cy="60" r="5"/><circle class="node n2" cx="40" cy="150" r="4"/>
    <circle class="node n3" cx="80" cy="240" r="5"/><circle class="node n4" cx="170" cy="40" r="4"/>
    <circle class="node n2" cx="180" cy="130" r="6" fill="#bb9af7"/><circle class="node" cx="160" cy="220" r="4"/>
    <circle class="node n3" cx="260" cy="80" r="5" fill="#7dcfff"/><circle class="node n4" cx="250" cy="180" r="5"/>
  </g>
  <circle cx="60" cy="60" r="3" fill="#7dcfff">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M0 0 L120 70 L200 20"/>
  </circle>
  <circle cx="80" cy="240" r="3" fill="#bb9af7">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M0 0 L100 -110 L170 -60"/>
  </circle>

  <!-- right neural cluster (mirrored) -->
  <g stroke="#bb9af7" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M1140 60 L1030 40"/><path d="M1140 60 L1020 130"/><path d="M1160 150 L1020 130"/>
    <path d="M1120 240 L1020 130"/><path d="M1120 240 L1040 220"/><path d="M1030 40 L940 80"/>
    <path d="M1020 130 L950 180"/><path d="M1040 220 L950 180"/><path d="M940 80 L950 180"/>
  </g>
  <path class="flow" d="M1020 130 L940 80" stroke="#bb9af7" stroke-opacity="0.55" stroke-width="1.5"/>
  <path class="flow" d="M1140 60 L1020 130" stroke="#7dcfff" stroke-opacity="0.45" stroke-width="1.5"/>
  <g fill="#bb9af7">
    <circle class="node n3" cx="1140" cy="60" r="5"/><circle class="node" cx="1160" cy="150" r="4"/>
    <circle class="node n2" cx="1120" cy="240" r="5"/><circle class="node" cx="1030" cy="40" r="4"/>
    <circle class="node n4" cx="1020" cy="130" r="6" fill="#7aa2f7"/><circle class="node n2" cx="1040" cy="220" r="4"/>
    <circle class="node" cx="940" cy="80" r="5" fill="#7dcfff"/><circle class="node n3" cx="950" cy="180" r="5"/>
  </g>
  <circle cx="1140" cy="60" r="3" fill="#9ece6a">
    <animateMotion dur="4s" repeatCount="indefinite" path="M0 0 L-120 70 L-200 20"/>
  </circle>

  <!-- headline -->
  <text class="fadeUp d1" x="600" y="128" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="url(#nameGrad)" filter="url(#softGlow)">Shreyansh Goyal</text>
  <text class="fadeUp d2" x="600" y="178" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a9b1d6">Lead ML Engineer&#160;&#160;•&#160;&#160;MSc Data Science @ NTU Singapore</text>

  <!-- chips -->
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g class="fadeUp d3">
      <rect x="357" y="212" width="140" height="32" rx="16" fill="#7aa2f7" fill-opacity="0.08" stroke="#7aa2f7" stroke-opacity="0.5"/>
      <text x="427" y="233" text-anchor="middle" fill="#7aa2f7">Credit-Risk ML</text>
    </g>
    <g class="fadeUp d4">
      <rect x="511" y="212" width="64" height="32" rx="16" fill="#bb9af7" fill-opacity="0.08" stroke="#bb9af7" stroke-opacity="0.5"/>
      <text x="543" y="233" text-anchor="middle" fill="#bb9af7">GNNs</text>
    </g>
    <g class="fadeUp d5">
      <rect x="589" y="212" width="72" height="32" rx="16" fill="#9ece6a" fill-opacity="0.08" stroke="#9ece6a" stroke-opacity="0.5"/>
      <text x="625" y="233" text-anchor="middle" fill="#9ece6a">MLOps</text>
    </g>
    <g class="fadeUp d6">
      <rect x="675" y="212" width="168" height="32" rx="16" fill="#7dcfff" fill-opacity="0.08" stroke="#7dcfff" stroke-opacity="0.5"/>
      <text x="759" y="233" text-anchor="middle" fill="#7dcfff">Kaggle Competitor</text>
    </g>
  </g>
</svg>
