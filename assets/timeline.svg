<svg viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career timeline: IIT Bombay to UGRO Capital to MyShubhLife to NTU Singapore and beyond">
  <defs>
    <linearGradient id="tlGrad" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.33" stop-color="#9ece6a"/>
      <stop offset="0.66" stop-color="#e0af68"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="cometTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="cometGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7dcfff" flood-opacity="0.8"/>
    </filter>
    <style><![CDATA[
      .ms { opacity: 0; animation: appear 0.6s ease-out forwards; }
      .m1 { animation-delay: 0.3s; } .m2 { animation-delay: 0.7s; }
      .m3 { animation-delay: 1.1s; } .m4 { animation-delay: 1.5s; }
      .m5 { animation-delay: 1.9s; }
      @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .halo { animation: ripple 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .h2 { animation-delay: 0.5s; } .h3 { animation-delay: 1s; } .h4 { animation-delay: 1.5s; } .h5 { animation-delay: 2s; }
      @keyframes ripple { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }
      text { font-family: Segoe UI, Ubuntu, Helvetica, Arial, sans-serif; }
      @media (prefers-reduced-motion: reduce) {
        .ms, .halo { animation: none !important; }
        .ms { opacity: 1 !important; }
        .halo { opacity: 0 !important; }
      }
    ]]></style>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="14" fill="#16161e" stroke="#2a2e3f" stroke-width="2"/>

  <!-- base + animated line -->
  <line x1="70" y1="120" x2="1130" y2="120" stroke="#2a2e3f" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="120" x2="1130" y2="120" stroke="url(#tlGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1060" stroke-dashoffset="1060">
    <animate attributeName="stroke-dashoffset" values="1060;0" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </line>

  <!-- comet traveling the line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
    <g>
      <animateMotion dur="7s" begin="2.6s" repeatCount="indefinite" path="M70 120 L1130 120"/>
      <ellipse cx="-17" cy="0" rx="20" ry="2.4" fill="url(#cometTail)"/>
      <circle cx="0" cy="0" r="4" fill="#7dcfff" filter="url(#cometGlow)"/>
    </g>
  </g>

  <!-- 2019 IIT Bombay (above) -->
  <g class="ms m1">
    <text x="120" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#c0caf5">2019</text>
    <text x="120" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#7aa2f7">IIT Bombay</text>
    <text x="120" y="98" text-anchor="middle" font-size="12.5" fill="#787c99">B.Tech · Mechanical Engineering</text>
    <line x1="120" y1="104" x2="120" y2="110" stroke="#7aa2f7" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo" cx="120" cy="120" r="9" fill="none" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="120" cy="120" r="9" fill="#7aa2f7"/>
  </g>

  <!-- 2023 UGRO (below) -->
  <g class="ms m2">
    <circle class="halo h2" cx="370" cy="120" r="9" fill="none" stroke="#9ece6a" stroke-width="2"/>
    <circle cx="370" cy="120" r="9" fill="#9ece6a"/>
    <line x1="370" y1="130" x2="370" y2="136" stroke="#9ece6a" stroke-width="2" stroke-opacity="0.5"/>
    <text x="370" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#c0caf5">2023</text>
    <text x="370" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#9ece6a">UGRO Capital</text>
    <text x="370" y="206" text-anchor="middle" font-size="12.5" fill="#787c99">Analyst - ML Processes</text>
  </g>

  <!-- 2025 MyShubhLife (above) -->
  <g class="ms m3">
    <text x="620" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#c0caf5">2025</text>
    <text x="620" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#e0af68">MyShubhLife</text>
    <text x="620" y="98" text-anchor="middle" font-size="12.5" fill="#787c99">Lead ML Engineer</text>
    <line x1="620" y1="104" x2="620" y2="110" stroke="#e0af68" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo h3" cx="620" cy="120" r="9" fill="none" stroke="#e0af68" stroke-width="2"/>
    <circle cx="620" cy="120" r="9" fill="#e0af68"/>
  </g>

  <!-- 2026 NTU (below) -->
  <g class="ms m4">
    <circle class="halo h4" cx="870" cy="120" r="9" fill="none" stroke="#bb9af7" stroke-width="2"/>
    <circle cx="870" cy="120" r="9" fill="#bb9af7"/>
    <line x1="870" y1="130" x2="870" y2="136" stroke="#bb9af7" stroke-width="2" stroke-opacity="0.5"/>
    <text x="870" y="160" text-anchor="middle" font-size="20" font-weight="800" fill="#c0caf5">2026</text>
    <text x="870" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#bb9af7">NTU Singapore</text>
    <text x="870" y="206" text-anchor="middle" font-size="12.5" fill="#787c99">MSc Data Science</text>
  </g>

  <!-- beyond (above) -->
  <g class="ms m5">
    <text x="1105" y="48" text-anchor="middle" font-size="20" font-weight="800" fill="#c0caf5">2027+</text>
    <text x="1105" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#7dcfff">What's next ✦</text>
    <text x="1105" y="98" text-anchor="middle" font-size="12.5" fill="#787c99">research × production ML</text>
    <line x1="1105" y1="104" x2="1105" y2="110" stroke="#7dcfff" stroke-width="2" stroke-opacity="0.5"/>
    <circle class="halo h5" cx="1105" cy="120" r="9" fill="none" stroke="#7dcfff" stroke-width="2"/>
    <circle cx="1105" cy="120" r="9" fill="#7dcfff"/>
  </g>
</svg>
